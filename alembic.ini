# Alembic configuration file
# This file is read by `alembic` for migration commands.
# The sqlalchemy.url is overridden in migrations/env.py using settings.SYNC_DATABASE_URL
# so the value below is a placeholder — do not hardcode real credentials here.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration filenames
file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# leave blank for localtime
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
sourceless = false

# version location specification; This defaults
# to migrations/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
version_locations = %(here)s/migrations/versions

# the output encoding used when revision files
# are written from script.py.mako
output_encoding = utf-8

# Placeholder URL — overridden by migrations/env.py which reads from .env
# Use SYNC_DATABASE_URL in your .env file (psycopg2 driver, not asyncpg)
sqlalchemy.url = postgresql+psycopg2://nexuscrm:nexuscrm_pass@localhost:5432/nexuscrm_db


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
