[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nexuscrm-ai"
version = "1.0.0"
description = "NexusCRM AI — Production-oriented Agentic AI CRM"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.12",

    # Database — PostgreSQL
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",

    # Database — MongoDB
    "motor==3.6.0",
    "pymongo==4.10.1",

    # Auth
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",

    # Config / Validation
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",

    # LangChain / LangGraph
    "langchain==0.3.12",
    "langchain-openai==0.2.12",
    "langchain-community==0.3.12",
    "langchain-core==0.3.25",
    "langgraph==0.2.56",
    "langsmith==0.2.3",

    # OpenAI
    "openai==1.57.2",
    "tiktoken==0.8.0",

    # Vector stores
    "faiss-cpu==1.9.0",
    "chromadb==0.5.23",
    "pinecone-client==5.0.1",

    # Embeddings / NLP
    "sentence-transformers==3.3.1",

    # Document processing
    "pypdf==5.1.0",
    "unstructured==0.16.10",

    # HTTP / async
    "httpx==0.28.1",
    "aiohttp==3.11.10",
    "tenacity==9.0.0",

    # Caching
    "cachetools==5.5.0",

    # Rate limiting
    "slowapi==0.1.9",

    # Logging / observability
    "structlog==24.4.0",

    # Streamlit UI
    "streamlit==1.40.2",
    "plotly==5.24.1",
    "pandas==2.2.3",

    # Utilities
    "numpy==1.26.4",
    "python-dateutil==2.9.0.post0",
    "rich==13.9.4",
]

[project.optional-dependencies]
ml = [
    "torch==2.5.1",
    "transformers==4.47.0",
    "tensorflow==2.18.0",
    "datasets==3.2.0",
    "scikit-learn==1.5.2",
    "huggingface-hub==0.26.5",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "black==24.10.0",
    "ruff==0.8.3",
    "mypy==1.13.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
